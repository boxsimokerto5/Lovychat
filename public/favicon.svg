    <path d="M 256 160
             C 336 160 415 186 415 272
             C 415 348 350 382 288 382
             C 264 382 238 376 216 388
             L 174 416
             C 161 425 148 418 148 402
             L 148 372
             C 112 355 95 318 95 272
             C 95 186 176 160 256 160 Z"
