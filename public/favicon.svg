<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D285" />
      <stop offset="35%" stop-color="#00BA71" />
      <stop offset="70%" stop-color="#019154" />
      <stop offset="100%" stop-color="#016238" />
    </linearGradient>

    <!-- Gloss Highlight Gradient -->
    <linearGradient id="favGlossGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Heart Gradient -->
    <linearGradient id="favHeartGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#027D4C" />
      <stop offset="50%" stop-color="#015D37" />
      <stop offset="100%" stop-color="#014327" />
    </linearGradient>

    <filter id="favBubbleShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#013A20" flood-opacity="0.32" />
    </filter>

    <filter id="favHeartShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#012B18" flood-opacity="0.25" />
    </filter>

    <clipPath id="favSquircleClip">
      <rect x="12" y="12" width="488" height="488" rx="118" ry="118" />
    </clipPath>
  </defs>

  <!-- Main Squircle Background -->
  <rect x="12" y="12" width="488" height="488" rx="118" ry="118" fill="url(#favBgGrad)" />

  <!-- Diagonal Gloss Reflection -->
  <g clip-path="url(#favSquircleClip)">
    <path d="M 0 0 L 512 0 L 512 160 C 370 170 210 240 100 370 C 50 430 20 480 0 512 Z" fill="url(#favGlossGrad)" />
    <path d="M 12 120 C 12 50 50 12 120 12 L 392 12 C 430 12 460 30 480 60 C 370 60 220 120 120 240 C 60 310 25 410 12 480 Z" fill="#FFFFFF" opacity="0.08" />
  </g>

  <!-- Sparkles -->
  <g transform="translate(440, 105)">
    <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#E2FFF0" opacity="0.85" />
  </g>
  <g transform="translate(85, 345)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#E2FFF0" opacity="0.8" />
  </g>
  <g transform="translate(450, 442)">
    <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11 Z" fill="#E2FFF0" opacity="0.85" />
  </g>

  <!-- Layered Background Bubble -->
  <g opacity="0.28" transform="translate(232, 185) scale(0.92) translate(-232, -185)">
    <path d="M 150 160 C 150 115 190 85 240 85 C 290 85 330 115 330 160 C 330 178 322 195 310 208 L 316 232 C 317 236 313 239 309 237 L 285 226 C 271 232 256 235 240 235 C 190 235 150 205 150 160 Z" fill="#FFFFFF" />
    <path d="M 240 142 C 235 132 222 125 210 130 C 196 136 195 152 205 165 L 240 195 L 275 165 C 285 152 284 136 270 130 C 258 125 245 132 240 142 Z" fill="#015230" opacity="0.4" />
  </g>

  <!-- Main Speech Bubble Shape -->
