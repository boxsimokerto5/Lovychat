    <path d="M 276 430 C 275 435 271 439 265 439 C 259 439 254 433 254 425 C 254 416 261 411 269 411 C 274 411 278 414 278 418 C 278 420 276 422 274 421 C 272 420 270 417 267 417 C 262 417 258 422 258 426 C 258 432 262 435 266 435 C 270 435 273 432 274 429 C 275 428 277 429 276 430 Z" />
