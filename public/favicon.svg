             C 210 205 210 222 215 236
             C 217 240 214 245 209 243
             C 204 241 201 234 199 226
             C 196 212 198 198 206 189
             C 210 184 218 188 216 195 Z"
          fill="#FFFFFF" opacity="0.92" />
  </g>

