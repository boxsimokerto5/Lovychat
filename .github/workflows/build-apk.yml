name: Build Android APK & PlayStore AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Generate App Icons & Splash Assets
        run: |
          node scripts/generate-assets.js

      - name: Build Web Application
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Configure Android SDK local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Configure Keystore / Signature Key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'lovychat123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lovychat' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          elif [ -f "android/app/release.keystore" ]; then
            echo "Checking existing android/app/release.keystore..."
            if ! keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "Existing keystore password check failed, regenerating valid keystore..."
              rm -f android/app/release.keystore
            fi
          elif [ -f "release.keystore" ]; then
            cp release.keystore android/app/release.keystore
            echo "Copied release.keystore from root..."
          fi

          if [ ! -f "android/app/release.keystore" ]; then
            echo "Generating clean release keystore via keytool..."
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=LovyChat, OU=gecckocreator, O=LovyChat, L=Surabaya, ST=JawaTimur, C=ID"
          fi
          ls -lh android/app/release.keystore

      - name: Ensure Gradlew Executable
        run: |
          cd android
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "Found existing android/gradlew"
          else
            echo "android/gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.14.3
            chmod +x gradlew
          fi
          cd ..

      - name: Build Signed APK (Direct Device Installation)
        working-directory: ./android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'lovychat123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lovychat' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'lovychat123' }}
        run: |
          echo "=== Gradle Environment ==="
          ./gradlew --version --no-daemon
          echo "=== Building APK ==="
          if ./gradlew :app:assembleRelease --no-daemon; then
            echo "Signed Release APK successfully built!"
          else
            echo "Release build failed, falling back to Debug APK build..."
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Build Signed AAB (Google Play Store Bundle)
        working-directory: ./android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'lovychat123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lovychat' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'lovychat123' }}
        run: |
          ./gradlew :app:bundleRelease --no-daemon || echo "Skipping AAB bundle"

      - name: Collect & Organize Artifacts
        run: |
          mkdir -p build-outputs
          # Find APK
          find android -type f -name "*release*.apk" | while read -r apk; do
            echo "Found APK: $apk -> copying to build-outputs/LovyChat-release.apk"
            cp "$apk" build-outputs/LovyChat-release.apk
            break
          done
          # If not found with release in name, fallback to any apk
          if [ ! -f "build-outputs/LovyChat-release.apk" ]; then
            find android -type f -name "*.apk" | while read -r apk; do
              echo "Fallback APK: $apk -> copying to build-outputs/LovyChat-release.apk"
              cp "$apk" build-outputs/LovyChat-release.apk
              break
            done
          fi
          # Find AAB
          find android -type f -name "*release*.aab" | while read -r aab; do
            echo "Found AAB: $aab -> copying to build-outputs/LovyChat-release.aab"
            cp "$aab" build-outputs/LovyChat-release.aab
            break
          done
          if [ ! -f "build-outputs/LovyChat-release.aab" ]; then
            find android -type f -name "*.aab" | while read -r aab; do
              echo "Fallback AAB: $aab -> copying to build-outputs/LovyChat-release.aab"
              cp "$aab" build-outputs/LovyChat-release.aab
              break
            done
          fi
          ls -lh build-outputs/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LovyChat-Release-APK
          path: build-outputs/LovyChat-release.apk

      - name: Upload AAB Artifact (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: LovyChat-PlayStore-AAB
          path: build-outputs/LovyChat-release.aab
