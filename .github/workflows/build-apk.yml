name: Build Android APK & PlayStore AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Generate App Icons & Splash Assets
        run: |
          node scripts/generate-assets.js

      - name: Build Web Application
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Configure Keystore / Signature Key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          elif [ -f "android/app/release.keystore" ]; then
            echo "Using pre-configured release.keystore in repository..."
          elif [ -f "release.keystore" ]; then
            cp release.keystore android/app/release.keystore
            echo "Using release.keystore from root directory..."
          else
            echo "Generating fallback release keystore..."
            keytool -genkey -v -keystore android/app/release.keystore \
              -alias lovychat -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass lovychat123 -keypass lovychat123 \
              -dname "CN=LovyChat, OU=Mobile, O=LovyChat, L=Surabaya, ST=JawaTimur, C=ID"
          fi
          ls -lh android/app/release.keystore

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Signed APK (Direct Installation)
        working-directory: ./android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'lovychat123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lovychat' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'lovychat123' }}
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Build Signed AAB (Google Play Store Bundle)
        working-directory: ./android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'lovychat123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'lovychat' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'lovychat123' }}
        run: |
          ./gradlew bundleRelease --no-daemon

      - name: Organize Artifacts
        run: |
          mkdir -p build-outputs
          # Find APK
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" build-outputs/LovyChat-release.apk
            echo "APK ready at build-outputs/LovyChat-release.apk"
          fi
          # Find AAB
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" build-outputs/LovyChat-release.aab
            echo "AAB ready at build-outputs/LovyChat-release.aab"
          fi
          ls -lh build-outputs/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LovyChat-Release-APK
          path: build-outputs/LovyChat-release.apk
          if-no-files-found: error

      - name: Upload AAB Artifact (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: LovyChat-PlayStore-AAB
          path: build-outputs/LovyChat-release.aab
          if-no-files-found: error
